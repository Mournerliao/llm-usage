[project]
name = "llm-usage"
version = "0.4.0"
description = "个人 LLM 周用量看板：token 明细与折算成本，静态 SVG 与 React 组件展示"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    'tzdata>=2025.2; platform_system == "Windows"',
]

[tool.setuptools.packages.find]
include = ["llm_usage*"]


# 原始数据一变就重新生成产物（data/stats.json 与 assets/*.svg）。
#
# 为什么放在 CI 而不是本机：产物由原始数据完全决定，放在这里单点串行生成，两台机器
# 就都不必碰产物文件，也不会在上面互相冲突。
#
# 聚合与渲染只读仓库内的文件——不访问网络、不需要 Cursor 登录态、不需要任何 secret。
# 采集是唯一需要凭据的环节，它只在本机跑（见 update-local.sh）。
name: build artifacts

on:
  push:
    branches: [main]
    paths:
      - "data/raw/**"
      - "config/aggregate.yaml"
      - "aggregate.py"
      - "ranking.py"
      - "render.py"
      - "config.py"
      - "collectors/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # 两台机器接连推送时串行执行，避免并发提交产物。不取消进行中的那次：它已经
  # 在推产物了，中途掐掉会留下没有对应产物的原始数据。
  group: build-artifacts
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 跨语言口径一致性测试需要 node 与 react/node_modules，所以这里把它们装上。
      # 下面还会设 PARITY_STRICT，确保装漏了是报错而不是静默跳过。
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 安装前端依赖
        working-directory: react
        run: npm ci --no-audit --no-fund

      - name: 跑单测
        env:
          PARITY_STRICT: "1"
        run: |
          python tests/test_core.py
          python tests/test_parity.py

      - name: 重新生成 stats.json 与 SVG
        run: python run.py --skip-collect

      - name: 提交产物
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json assets
          if git diff --cached --quiet; then
            echo "产物无变化，跳过提交。"
            exit 0
          fi
          git commit -m "chore(ci): rebuild usage artifacts"
          git push

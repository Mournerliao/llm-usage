# 公共聚合配置：不含任何密钥，随仓库提交，CI 用它重新生成 stats.json 与 SVG。
# 本机专属的采集配置（机器名、base_url、key 环境变量名）在 sources.yaml 里，不提交。

# 所有日切统一按这个时区计算。两台机器都用同一个值，否则同一次请求在两边会归到不同天。
timezone: Asia/Shanghai

# 模型名归一表：同一模型在不同机器 / 不同工具下的标签可能不同，
# 不归一的话模型排行会把同一个模型拆成多行。
#
# 原始事件里保留原名，归一只在聚合阶段做，将来发现映射错了可以重跑修正。
# 路由别名（Cursor 的 auto-smart）不进此表——它不是模型，等能解出背后的真实模型时
# 应该换成真名，而不是映射到另一个假名。
model_aliases: {}

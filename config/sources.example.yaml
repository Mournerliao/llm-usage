# ADE 用量采集配置
# 复制本文件为 sources.yaml 并填入你自己的源；sources.yaml 已被 .gitignore 忽略，不会提交到仓库。
# 凭据通过环境变量 / 仓库 Secrets 注入，不要写死在文件里。

sources:
  # —— API 类：OpenAI / DeepSeek / 所有 OpenAI 兼容中转 共用一个采集器 ——
  - name: openai
    type: openai_compatible
    base_url: https://api.openai.com
    api_key_env: OPENAI_API_KEY        # 在你的环境 / 仓库 Secrets 中设置

  - name: deepseek
    type: openai_compatible
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY

  - name: relay-a                      # 中转站：换站只改这里 + 对应 env 名，无需改代码
    type: openai_compatible
    base_url: https://your-relay.example.com
    api_key_env: RELAY_A_API_KEY

  # —— 本地类：Cursor（需本机脚本运行，Action 读取其推送结果）——
  - name: cursor
    type: cursor
    # Windows 路径（默认）；macOS 为 ~/Library/Application Support/Cursor/User/workspaceStorage/*/state.vscdb
    db_glob: "%APPDATA%/Cursor/User/workspaceStorage/*/state.vscdb"

  # —— 本地类：WorkBuddy（读 ~/.workbuddy/workbuddy.db，需本机运行）——
  - name: workbuddy
    type: workbuddy
    # db_path 可选；不填则自动探测 ~/.workbuddy/workbuddy.db（跨平台）
